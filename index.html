<style>
  :root{--bg1:#ffe3ec;--bg2:#fffafb;--card:#ee566f;--border:#ffc2d4;--text:#ffffff;--muted:#ffe6ed;--accent:#d6193f;--pink:#ff8fb1;--online:#3ba55d;--offline:#c9a3af}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 0%,#ffc9d9 0%,#ffe3ec 55%,#fff3f7 100%);color:var(--text);font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;overflow-x:hidden}
  .card{position:relative;z-index:2;width:100%;max-width:440px;background:var(--card);border:2px solid var(--border);border-radius:16px;padding:32px;box-shadow:0 14px 50px rgba(214,25,63,.25);animation:in .6s ease both}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .head{display:flex;align-items:center;gap:16px;margin-bottom:24px}
  .pfp{width:72px;height:72px;border-radius:50%;border:3px solid var(--pink);object-fit:cover;background:var(--border)}
  h1{font-size:1.4rem;color:#fff}
  .status{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin-top:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--offline)}
  .dot.online{background:var(--online)}.dot.idle{background:#f0b232}.dot.dnd{background:#f23f43}
  .activity{font-size:.8rem;color:var(--muted);margin-top:4px}.activity:empty{display:none}
  h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.15em;color:#ffe3ec;margin:24px 0 10px}
  p{font-size:.9rem;line-height:1.6;color:var(--text)}
  .links{display:flex;flex-wrap:wrap;gap:8px}
  .links a{color:var(--text);text-decoration:none;font-size:.85rem;padding:8px 14px;border:2px solid var(--border);border-radius:8px;transition:.15s}
  .links a:hover,.links a:focus-visible{border-color:#fff;background:#fff;color:#d6193f;transform:translateY(-2px);outline:none}
  .tabs{position:fixed;top:16px;left:16px;display:flex;gap:6px;z-index:10}
  .tab{font:inherit;font-size:.8rem;color:#b0143a;background:#fff;border:2px solid var(--border);border-radius:8px;padding:8px 14px;transition:.15s}
  .tab:hover,.tab:focus-visible{border-color:#ee566f;outline:none}
  .tab.active{background:#ee566f;border-color:#ee566f;color:#fff}
  .page[hidden]{display:none}
  .friends{list-style:none;display:flex;flex-direction:column;gap:8px}
  .friends li{padding:12px 14px;border:2px solid var(--border);border-radius:10px;font-size:1rem;color:#fff}
  .petal{position:fixed;top:-30px;z-index:1;pointer-events:none;width:12px;height:12px;background:var(--pink);border-radius:80% 0 80% 0;opacity:.8;animation:fall linear infinite}
  .petal.w{background:#fff;border:1px solid var(--border)}
  .petal.r{background:#ee566f;opacity:.6}
  @keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
  #cursor{position:fixed;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(214,25,63,.55);pointer-events:none;z-index:99;opacity:0;transition:width .15s,height .15s,margin .15s,background .15s,opacity .15s}
  #cursor.on{opacity:1}
  #cursor.hot{width:34px;height:34px;margin:-17px 0 0 -17px;opacity:.8}
  @media (hover:hover) and (pointer:fine){html,html *{cursor:none!important}}
  @media (hover:none){#cursor{display:none}}
  @media (prefers-reduced-motion:reduce){.petal{display:none}*{transition:none!important}.card{animation:none}}
</style>
</head>

    statusEl.textContent = s === 'dnd' ? 'Do Not Disturb' : s[0].toUpperCase() + s.slice(1);
    let text = '';
    if (d.listening_to_spotify && d.spotify) {
      text = '🎵 ' + d.spotify.song + ' - ' + d.spotify.artist;
    } else {
      const game = (d.activities || []).find(a => a.type === 0);
      const custom = (d.activities || []).find(a => a.type === 4);
      if (game) text = 'Playing ' + game.name;
      else if (custom && custom.state) text = custom.state;
    }
    activityEl.textContent = text;
  }

  fetch('https://api.lanyard.rest/v1/users/' + DISCORD_ID)
    .then(r => r.json()).then(j => j.success && render(j.data)).catch(() => {});

  function connect() {
    const ws = new WebSocket('wss://api.lanyard.rest/socket');
    let beat;
    ws.onmessage = e => {
      const { op, d, t } = JSON.parse(e.data);
      if (op === 1) {
        beat = setInterval(() => ws.send(JSON.stringify({ op: 3 })), d.heartbeat_interval);
        ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_ID } }));
      } else if (op === 0 && (t === 'INIT_STATE' || t === 'PRESENCE_UPDATE')) {
        render(d);
      }
    };
    ws.onclose = () => { clearInterval(beat); setTimeout(connect, 5000); };
  }
  connect();
</script>
</body>
</html>
